apiVersion: apps/v1
kind: Deployment
metadata:
  name: powinfo
  namespace: hpa-demo
  labels:
    app.kubernetes.io/name: powinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: powinfo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powinfo
    spec:
      containers:
        - name: powinfo
          image: powinfo:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
